# Production stack for the EC2 host. Images are built by CodeBuild (buildspec.yml) and pushed to ECR.
# Configuration comes from backend/.env and email-microservice/.env on the server.
# Override the registry or tag with ECR_REGISTRY / IMAGE_TAG in the shell or a root .env file.
name: circle

x-backend-image: &backend-image ${ECR_REGISTRY:-019256649767.dkr.ecr.us-east-1.amazonaws.com}/my-app-backend:${IMAGE_TAG:-latest}

services:
  api:
    image: *backend-image
    container_name: circle-api
    command: ["node", "src/server.js"]
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      SERVICE_NAME: social-api
    ports:
      - "${API_PORT:-5000}:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    image: *backend-image
    container_name: circle-worker
    command: ["node", "src/workers/index.js"]
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      SERVICE_NAME: social-worker
    restart: unless-stopped
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy

  email:
    image: ${ECR_REGISTRY:-019256649767.dkr.ecr.us-east-1.amazonaws.com}/my-app-email:${IMAGE_TAG:-latest}
    container_name: circle-email
    env_file: ./email-microservice/.env
    environment:
      NODE_ENV: production
    restart: unless-stopped
