version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: "us-east-1"
    BACKEND_REPOSITORY: "my-app-backend"
    EMAIL_REPOSITORY: "my-app-email"

phases:
  pre_build:
    commands:
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - ECR_REGISTRY=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - COMMIT_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
  build:
    commands:
      - docker build -t $ECR_REGISTRY/$BACKEND_REPOSITORY:latest -t $ECR_REGISTRY/$BACKEND_REPOSITORY:$COMMIT_TAG ./backend
      - docker build -t $ECR_REGISTRY/$EMAIL_REPOSITORY:latest -t $ECR_REGISTRY/$EMAIL_REPOSITORY:$COMMIT_TAG ./email-microservice
  post_build:
    commands:
      - docker push --all-tags $ECR_REGISTRY/$BACKEND_REPOSITORY
      - docker push --all-tags $ECR_REGISTRY/$EMAIL_REPOSITORY
      - printf 'ECR_REGISTRY=%s\nIMAGE_TAG=%s\n' "$ECR_REGISTRY" "$COMMIT_TAG" > .deploy.env

artifacts:
  files:
    - appspec.yml
    - docker-compose.yml
    - .deploy.env
    - scripts/**/*
